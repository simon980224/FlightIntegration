<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editProfileModalLabel">編輯個人資料</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editProfileForm" enctype="multipart/form-data">
            <div class="text-center mb-4">
              <label for="photoUpload" class="profile-photo-container position-relative mx-auto d-block" style="cursor: pointer; width: 120px; height: 120px;">
                <img src="{{ user.User_Img }}" alt="使用者照片預覽" class="rounded-circle" style="width: 120px; height: 120px; object-fit: cover;" id="modalProfilePhotoPreview">
                <div class="profile-photo-overlay position-absolute top-0 start-0 w-100 h-100 rounded-circle d-flex justify-content-center align-items-center text-white">
                    <i class="fas fa-camera fa-lg"></i> <span class="ms-2">更換頭像</span>
                </div>
              </label>
              <input type="file" id="photoUpload" name="user_img" class="d-none" accept="image/*">
            </div>
            <div class="mb-3">
              <label for="username" class="form-label">使用者名稱</label>
              <input type="text" class="form-control" id="username" name="user_name" value="{{ user.User_Name }}" required>
            </div>
            <div class="mb-3">
              <label for="old_password" class="form-label">舊密碼</label>
              <input type="password" class="form-control" id="old_password" name="old_password" placeholder="如需變更密碼請輸入舊密碼">
              <small class="form-text text-muted">若不需變更密碼，此欄位請留空</small>
            </div>
            <div class="mb-3">
              <label for="new_password" class="form-label">新密碼</label>
              <input type="password" class="form-control" id="new_password" name="new_password" placeholder="輸入新密碼">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" form="editProfileForm" class="btn btn-primary">儲存變更</button>
        </div>
      </div>
    </div>
</div>
<script>
    document.getElementById("registerFormElement").addEventListener("submit", function(event) {
    event.preventDefault(); // 阻止表單預設提交行為

    // 取得並 trim 各輸入欄位
    const user_id = document.getElementById("reg_user_id").value.trim();
    const user_name = document.getElementById("user_name").value.trim();
    const password = document.getElementById("reg_password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // 1. 基本欄位檢查
    if (!user_id || !user_name || !password || !confirmPassword) {
        showToast("提示", "請填寫完整資料", "warning");
        return;
    }

    // 2. 密碼一致性檢查
    if (password !== confirmPassword) {
        showToast("提示", "密碼與確認密碼不符", "warning");
        return;
    }

    // 3. 顯示載入中
    showLoading("註冊中", "正在建立您的帳號，請稍候...");

    // 4. 組裝要送出的 payload
    const payload = { user_id, user_name, password, confirmPassword };

    // 5. 發送註冊請求
    fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
    })
        .then(response => response.json())
        .then(data => {
        closeLoading();
        if (data.success) {
            // 註冊成功，顯示成功訊息後切換 Modal
            showToast("註冊成功！", "歡迎加入我們的會員", "success")
            .then(() => {
                // 關閉註冊 Modal
                const regModalEl = document.getElementById("registerModal");
                const regModal = bootstrap.Modal.getInstance(regModalEl)
                                || new bootstrap.Modal(regModalEl);
                regModal.hide();

                // 打開登入 Modal
                const loginModal = new bootstrap.Modal(document.getElementById("loginModal"));
                loginModal.show();
            });
        } else {
            // 後端回傳失敗，顯示錯誤訊息
            showToast("註冊失敗", data.message || "請檢查輸入", "error");
        }
        })
        .catch(error => {
        closeLoading();
        console.error("註冊過程中出錯:", error);
        showToast("發生錯誤", "請稍後再試", "error");
        });
    });

</script>
