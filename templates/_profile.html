<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="editProfileModalLabel">編輯個人資料</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="editProfileForm" method="POST" enctype="multipart/form-data">
        <div class="modal-body">
          <div class="text-center mb-4">
            <label for="photoUpload" class="profile-photo-container position-relative mx-auto d-block" style="cursor: pointer; width: 120px; height: 120px;">
              <img src="{{ url_for('static', filename='img/user_photos/' + (user.User_Img or 'default_user.png')) }}"
                   alt="使用者照片預覽"
                   class="rounded-circle"
                   style="width: 120px; height: 120px; object-fit: cover;"
                   id="modalProfilePhotoPreview">
              <div class="profile-photo-overlay position-absolute top-0 start-0 w-100 h-100 rounded-circle d-flex justify-content-center align-items-center text-white">
                <i class="fas fa-camera fa-lg"></i> <span class="ms-2">更換頭像</span>
              </div>
            </label>
            <input type="file" id="photoUpload" name="user_img" class="d-none" accept="image/jpeg, image/png, image/jpg">
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">使用者名稱</label>
            <input type="text" class="form-control" id="username" name="user_name" value="{{ user.User_Name }}" required>
          </div>

          <div class="mb-3">
            <label for="user_email" class="form-label">電子郵件</label>
            <input type="email" class="form-control" id="user_email" name="user_email" value="{{ user.User_Email or '' }}" required>
          </div>

          <a data-bs-toggle="collapse" href="#changePasswordFields" role="button" aria-expanded="false" aria-controls="changePasswordFields" class="text-decoration-none">
            <p class="mb-2 text-primary" style="cursor: pointer;">
              變更密碼 <i class="fas fa-chevron-down text-primary" id="passwordChevron"></i>
            </p>
          </a>
          
          <div class="collapse" id="changePasswordFields">
            <div class="mb-3">
              <label for="old_password" class="form-label">舊密碼
                <span class="text-danger">*</span>
              </label>
              <input type="password" class="form-control" id="old_password" name="old_password" placeholder="請輸入舊密碼">
            </div>
  
            <div class="mb-3">
              <label for="new_password" class="form-label">新密碼
                <span class="text-danger">*</span>
              </label>
              <input type="password" class="form-control" id="new_password" name="new_password" placeholder="輸入新密碼">
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-primary">儲存變更</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const editProfileForm = document.getElementById('editProfileForm');
  const photoUpload = document.getElementById('photoUpload');
  const modalProfilePhotoPreview = document.getElementById('modalProfilePhotoPreview');
  const editProfileModalEl = document.getElementById('editProfileModal');
  const editProfileModal = bootstrap.Modal.getOrCreateInstance(editProfileModalEl);
  const originalImgSrc = modalProfilePhotoPreview.src;
  const changePasswordFields = document.getElementById('changePasswordFields');
  const oldPasswordInput = document.getElementById('old_password');
  const newPasswordInput = document.getElementById('new_password');
  const passwordChevron = document.getElementById('passwordChevron');

  // 根據摺疊狀態動態設定密碼欄位是否必填
  if(changePasswordFields) {
    changePasswordFields.addEventListener('show.bs.collapse', function () {
      oldPasswordInput.required = true;
      newPasswordInput.required = true;
      passwordChevron.classList.remove('fa-chevron-down');
      passwordChevron.classList.add('fa-chevron-up');
    });
  
    changePasswordFields.addEventListener('hide.bs.collapse', function () {
      oldPasswordInput.required = false;
      newPasswordInput.required = false;
      // 收合時清除數值
      oldPasswordInput.value = '';
      newPasswordInput.value = '';
      passwordChevron.classList.remove('fa-chevron-up');
      passwordChevron.classList.add('fa-chevron-down');
    });
  }

  // 頭像預覽
  photoUpload.addEventListener('change', function (event) {
    const file = event.target.files[0];
    if (file) {
      // 檔案類型檢查
      const allowedTypes = ['image/jpeg', 'image/png', 'image/jpg'];
      if (!allowedTypes.includes(file.type)) {
        showToast('上傳失敗！', '僅允許 JPG, JPEG, PNG 格式的圖片。', 'error');
        event.target.value = ''; // 清空 file input
        return;
      }

      // 檔案大小檢查 (5MB)
      const maxSizeInBytes = 5 * 1024 * 1024;
      if (file.size > maxSizeInBytes) {
        showToast('上傳失敗！', '檔案大小不能超過 5MB。', 'error');
        event.target.value = ''; // 清空 file input
        return;
      }
      
      // 預覽圖片
      if (modalProfilePhotoPreview) {
        const reader = new FileReader();
        reader.onload = function (e) {
          modalProfilePhotoPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }
  });

  // 表單提交
  editProfileForm.addEventListener('submit', function (event) {
    event.preventDefault();
    
    const formData = new FormData(editProfileForm);
    const newPassword = formData.get('new_password');
    const oldPassword = formData.get('old_password');
    
    if (newPassword && !oldPassword) {
      showToast('操作失敗', '若要變更密碼，請提供您的舊密碼。', 'warning');
      return;
    }

    // 如果新密碼為空，則從 formData 中刪除密碼欄位，避免後端誤判
    if (!newPassword) {
      formData.delete('new_password');
      formData.delete('old_password');
    }

    const submitButton = editProfileForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    showLoading('儲存中...', '請稍候');

    fetch('/update_profile', {
      method: 'POST',
      body: formData
    })
      .then(response => response.json().then(data => ({ ok: response.ok, data })))
      .then(({ ok, data }) => {
        closeLoading();
        if (!ok || !data.success) {
          throw new Error(data.message || '更新失敗');
        }

        showToast('成功', data.message || '更新成功！', 'success').then(() => {
            editProfileModal.hide();
            editProfileModalEl.addEventListener('hidden.bs.modal', function () {
              location.reload();
            }, { once: true });
        });
      })
      .catch(error => {
        closeLoading();
        console.error('❌ 發生錯誤:', error);
        showToast('錯誤', error.message, 'error');
        submitButton.disabled = false;
      });
  });

  // 關閉時重設
  editProfileModalEl.addEventListener('hidden.bs.modal', function () {
    editProfileForm.reset();
    modalProfilePhotoPreview.src = originalImgSrc;

    // 如果密碼區塊是開啟的，則將其收合
    if (changePasswordFields.classList.contains('show')) {
      const bsCollapse = new bootstrap.Collapse(changePasswordFields, {
        toggle: false
      });
      bsCollapse.hide();
    }
  });
});
</script>
