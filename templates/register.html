{% extends 'base.html' %}
{% block title %}註冊 - 航班查詢系統{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-container">
    <h2 class="auth-title">註冊帳號</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <div class="form-group">
        <label for="username">使用者名稱</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <small class="form-text text-muted">密碼長度至少8個字元</small>
      </div>

      <div class="form-group">
        <label for="confirm_password">確認密碼</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="agree" name="agree" required>
        <label class="form-check-label" for="agree">
          我同意<a href="#" class="terms-link">服務條款</a>和<a href="#" class="terms-link">隱私政策</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100">註冊</button>
      
      <div class="auth-links">
        <a href="{{ url_for('login') }}" class="auth-link">已有帳號？立即登入</a>
      </div>
    </form>
  </div>
</div>

<style>
.auth-page {
  min-height: calc(100vh - 76px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #F8FAFF 0%, #F3F6FF 100%);
  padding: 2rem;
}

.auth-container {
  background: white;
  padding: 2.5rem;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(107, 141, 227, 0.1);
  width: 100%;
  max-width: 400px;
}

.auth-title {
  text-align: center;
  font-size: 1.8rem;
  color: var(--text-primary);
  margin-bottom: 2rem;
  font-weight: 700;
}

.auth-form .form-group {
  margin-bottom: 1.5rem;
}

.auth-form label {
  font-size: 0.95rem;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
}

.auth-form .form-control {
  padding: 0.8rem 1rem;
  border: 2px solid rgba(107, 141, 227, 0.2);
  border-radius: 12px;
  transition: all 0.3s ease;
}

.auth-form .form-control:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(107, 141, 227, 0.1);
}

.auth-form .btn-primary {
  padding: 0.8rem;
  font-weight: 600;
  border-radius: 12px;
  background: linear-gradient(135deg, #6B8DE3 0%, #5C7AE5 100%);
  border: none;
  margin-bottom: 1.5rem;
}

.auth-form .btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(107, 141, 227, 0.2);
}

.auth-links {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.auth-link {
  color: var(--accent-blue);
  text-decoration: none;
  font-size: 0.9rem;
  transition: all 0.3s ease;
}

.auth-link:hover {
  color: var(--primary-dark);
}

.form-check-input:checked {
  background-color: var(--accent-blue);
  border-color: var(--accent-blue);
}

.terms-link {
  color: var(--accent-blue);
  text-decoration: none;
  transition: all 0.3s ease;
}

.terms-link:hover {
  color: var(--primary-dark);
  text-decoration: underline;
}

.form-text {
  font-size: 0.85rem;
  margin-top: 0.5rem;
}
</style>
{% endblock %}
