<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}航班系統{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light {% block body_class %}bg-flight{% endblock %}">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="fas fa-plane-departure me-2 text-primary"></i>航班查詢系統
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">
              <i class="fas fa-home me-1"></i>首頁
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/flight">
              <i class="fas fa-search me-1"></i>航班查詢
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/ticket">
              <i class="fas fa-ticket-alt me-1"></i>訂票
            </a>
          </li>
        </ul>
        <ul class="navbar-nav">
          {% if user_id %}
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle me-1"></i>{{ user_id }}
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/profile"><i class="fas fa-user me-2"></i>個人資料</a></li>
                <li><a class="dropdown-item" href="/bookings"><i class="fas fa-list me-2"></i>我的訂票</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="/logout"><i class="fas fa-sign-out-alt me-2"></i>登出</a></li>
              </ul>
            </li>
          {% else %}
            <li class="nav-item">
              <button class="btn btn-link nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">
                <i class="fas fa-sign-in-alt me-1"></i>登入 / 註冊
              </button>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  {% include '_login.html' %}
  {% include '_register.html' %}

  <main class="py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

  {% if open_modal %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if ('{{ open_modal }}' === 'login') {
        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        loginModal.show();
      }
    });
  </script>
  {% endif %}
</body>
</html>
