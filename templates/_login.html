<!-- 登入模態框 -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-body p-4 p-md-5">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <h4 class="card-title mb-4 text-primary text-center">
          <i class="fas fa-sign-in-alt me-2"></i>會員登入
        </h4>

        <!-- 登入表單 -->
        <form id="loginFormElement">
          <div class="mb-3">
            <label for="loginUserid" class="form-label">使用者帳號</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" id="loginUserid" name="user_id" placeholder="請輸入您的帳號" required>
            </div>
          </div>
          <div class="mb-4">
            <label for="loginPassword" class="form-label">密碼</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
              <input type="password" class="form-control" id="loginPassword" name="password" placeholder="請輸入您的密碼" required>
            </div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="fas fa-sign-in-alt me-2"></i>登入
            </button>
          </div>
        </form>

        <hr class="my-4">
        
        <div class="text-center">
          <p class="text-muted mb-2">還沒有帳號嗎？</p>
          <a href="#"
            class="btn btn-outline-secondary"
            data-bs-dismiss="modal"
            data-bs-toggle="modal"
            data-bs-target="#registerModal">
            <i class="fas fa-user-plus me-2"></i>立即註冊
          </a>
        </div>
      </div>  
    </div>
  </div>
</div>

<script>
function Login(event) {
  event.preventDefault();  
  showLoading("登入中", "正在驗證您的帳號，請稍候...");

  const payload = {
    user_id:document.getElementById('loginUserid').value,
    password:document.getElementById('loginPassword').value
  };

  fetch('/login', {
    method:'POST',
    headers:{'Content-Type': 'application/json'},
    body:JSON.stringify(payload),
  })
  .then(res => res.json())
  .then(data => {
    closeLoading();
    if (data.success) {
      // 登入成功後顯示 toast，再重新載入
      return showToast('登入成功', '歡迎回來！', 'success')
        .then(() => location.reload());
    } else {
      // 登入失敗顯示錯誤
      showToast('登入失敗', '帳號或密碼錯誤', 'error');
    }
  })
  .catch(err => {
    closeLoading();
    console.error('Error:', err);
    showToast('發生錯誤', '請稍後再試', 'error');
  });
}
document
  .getElementById('loginFormElement')
  .addEventListener('submit', Login);
</script>
