<!-- 註冊模態框 -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-body p-4 p-md-5">
        <div class="text-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <h4 class="card-title mb-4 text-primary text-center">
          <i class="fas fa-user-plus me-2"></i>建立新帳號
        </h4>

        <form id="registerFormElement">
          <!-- 使用者名稱 -->
          <div class="mb-3">
            <label for="reg_user_id" class="form-label">使用者帳號</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" id="reg_user_id" name="reg_user_id" placeholder="3-20 個字元" required>
            </div>
          </div>
          <!-- 名稱 -->
          <div class="mb-3">
            <label for="user_name" class="form-label">使用者名稱</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" id="user_name" name="user_name" placeholder="3-20 個字元" required>
            </div>
          </div>
          <!-- 電子郵件 -->
          <!-- <div class="mb-3">
            <label for="email" class="form-label">電子郵件</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
            </div>
          </div> -->
          <!-- 密碼 -->
          <div class="mb-3">
            <label for="reg_password" class="form-label">密碼</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
              <input type="password" class="form-control" id="reg_password" name="reg_password" placeholder="至少 6 個字元" required>
            </div>
          </div>
          <!-- 確認密碼 -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">確認密碼</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-check-circle"></i></span>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="再次輸入密碼" required>
            </div>
          </div>
          
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="fas fa-user-plus me-2"></i>立即註冊
            </button>
          </div>
        </form>

        <hr class="my-4">

        <div class="text-center">
          <p class="text-muted mb-2">已經有帳號了嗎？</p>
          <a href="#" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="fas fa-sign-in-alt me-2"></i>立即登入
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("registerFormElement").addEventListener("submit", function (event) {
    event.preventDefault(); // 阻止表單預設提交

    const user_id = document.getElementById("reg_user_id").value.trim();
    const user_name = document.getElementById("user_name").value.trim();
    const password = document.getElementById("reg_password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // 基本欄位檢查
    if (!user_id || !user_name || !password || !confirmPassword) {
      showToast("提示", "請填寫完整資料", "warning");
      return;
    }

    // 密碼比對
    if (password !== confirmPassword) {
      showToast("提示", "密碼與確認密碼不符", "warning");
      return;
    }

    showLoading("註冊中", "正在建立您的帳號，請稍候...");

    const payload = { user_id, user_name, password, confirmPassword };

    fetch("/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload),
    })
      .then((response) => response.json())
      .then((data) => {
        closeLoading();
        if (data.success) {
          showToast("註冊成功！", "歡迎加入我們的會員", "success").then(() => {
            // 隱藏註冊 Modal
            const regModalEl = document.getElementById("registerModal");
            const regModal = bootstrap.Modal.getInstance(regModalEl) || new bootstrap.Modal(regModalEl);
            regModal.hide();

            // 顯示登入 Modal
            const loginModal = new bootstrap.Modal(document.getElementById("loginModal"));
            loginModal.show();
          });
        } else {
          showToast("註冊失敗", data.message || "請檢查輸入", "error");
        }
      })
      .catch((error) => {
        closeLoading();
        console.error("註冊過程中出錯:", error);
        showToast("發生錯誤", "請稍後再試", "error");
      });
  });
</script>
